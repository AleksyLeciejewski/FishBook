<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - FishBook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow-md overflow-hidden">
        <div class="bg-red-600 p-4 text-white">
            <h1 class="text-2xl font-bold">
                <i class="fas fa-exclamation-triangle mr-2"></i>
                Oops! Something went wrong
            </h1>
        </div>
        <div class="p-6">
            <p class="text-gray-700 mb-6">
                We're sorry, but an error occurred while processing your request. Please try again later or contact support if the problem persists.
            </p>
            <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-6">
                <p class="text-red-700 font-medium">Error details:</p>
                <p class="text-red-600 text-sm mt-1"><%= error.message %></p>
            </div>
            <div class="flex justify-end">
                <a href="/" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">
                    <i class="fas fa-home mr-2"></i>Return to Home
                </a>
            </div>
        </div>
    </div>
</body>
</html>
